<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AprilTag WASM Detector</title>
    <script src="https://unpkg.com/comlink/dist/umd/comlink.js"></script>
</head>
<body>
    <script>
        // This HTML file runs in a WebView and handles AprilTag detection using WASM
        let apriltag = null;
        let isReady = false;
        
        // Send message to React Native
        function sendMessage(message) {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify(message));
            }
        }
        
        // Load WASM detector
        async function initDetector() {
            try {
                // Create worker from apriltag.js
                const apriltagWorker = new Worker('./apriltag.js');
                const Apriltag = Comlink.wrap(apriltagWorker);
                
                apriltag = await new Apriltag(Comlink.proxy(() => {
                    // Detector ready callback
                    isReady = true;
                    sendMessage({ type: 'ready' });
                }));
                
                sendMessage({ type: 'initialized' });
            } catch (error) {
                sendMessage({ type: 'error', error: error.toString() });
            }
        }
        
        // Process image data
        async function processImage(imageDataArray, width, height) {
            if (!apriltag || !isReady) {
                sendMessage({ type: 'error', error: 'Detector not ready' });
                return;
            }
            
            try {
                // Convert RGBA array to Uint8Array grayscale
                const grayscalePixels = new Uint8Array(width * height);
                for (let i = 0, j = 0; i < imageDataArray.length; i += 4, j++) {
                    const grayscale = Math.round(
                        (imageDataArray[i] + imageDataArray[i + 1] + imageDataArray[i + 2]) / 3
                    );
                    grayscalePixels[j] = grayscale;
                }
                
                // Detect tags
                const detections = await apriltag.detect(grayscalePixels, width, height);
                sendMessage({ type: 'detections', detections });
            } catch (error) {
                sendMessage({ type: 'error', error: error.toString() });
            }
        }
        
        // Handle messages from React Native
        document.addEventListener('message', handleMessage);
        window.addEventListener('message', handleMessage);
        
        function handleMessage(event) {
            let data;
            try {
                // Handle both WebView postMessage and React Native messages
                if (typeof event.data === 'string') {
                    data = JSON.parse(event.data);
                } else {
                    data = event.data;
                }
            } catch (e) {
                return;
            }
            
            const { type, payload } = data;
            
            if (type === 'init') {
                initDetector();
            } else if (type === 'process') {
                const { imageData, width, height } = payload;
                processImage(imageData, width, height);
            }
        }
        
        // Notify React Native that script is loaded
        sendMessage({ type: 'loaded' });
    </script>
</body>
</html>
